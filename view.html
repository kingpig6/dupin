<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#f59e0b">
<title>獨品工坊 · 訂單查詢</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#111827; color:#f3f4f6; font-family:'Noto Sans TC',sans-serif; }
  .card { background:#1f2937; border-radius:12px; padding:16px; margin-bottom:12px; }
  .section-title { font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; margin-top:20px; }
  .badge-active { background:#1d4ed8; color:#fff; font-size:11px; padding:2px 8px; border-radius:99px; display:inline-block; }
  .badge-done   { background:#15803d; color:#fff; font-size:11px; padding:2px 8px; border-radius:99px; display:inline-block; }
</style>
</head>
<body class="px-4 pt-6 pb-10 max-w-lg mx-auto">

<div class="flex items-center gap-3 mb-6">
  <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center text-gray-900 font-black text-lg">獨</div>
  <div>
    <div class="font-bold text-amber-400 text-lg">獨品工坊</div>
    <div id="subtitle" class="text-xs text-gray-400">訂單查詢</div>
  </div>
</div>

<div id="app">
  <div class="text-center text-gray-500 mt-20">載入中…</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyeGdSEt24vgZtZzrG36oA4dkSPbEjGCSTUwAZ7xGViMV7zcWG1CrmNPnDoq_XIOopsEg/exec';

const token = new URLSearchParams(location.search).get('token');

// 縮圖網址：Google 圖片原檔常有數 MB，縮到 64px 顯示很浪費頻寬也很慢。
// lh3.googleusercontent.com 支援 =sN 參數直接取縮圖。
function thumbUrl(u) {
  if (/lh3\.googleusercontent\.com/.test(u) && !/=[sw]\d+/.test(u)) {
    return u.replace(/=.*$/, '') + '=s160';
  }
  return u;
}

// Apps Script 偶爾會回 echo 404 / HTML 錯誤頁（非 JSON），退避重試幾次再放棄，避免永遠卡在「載入中」
async function loadCustomerData() {
  const url = API_URL + '?action=customerView&token=' + encodeURIComponent(token);
  const MAX = 4;
  for (let i = 1; i <= MAX; i++) {
    try {
      const res = await fetch(url, { redirect: 'follow' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      if (i === MAX) throw e;
      // 首次失敗多半是 Apps Script 偶發的 echo 404，立刻重試即可；之後才逐步退避
      await new Promise(r => setTimeout(r, i === 1 ? 150 : 600 * Math.pow(2, i - 2)));
    }
  }
}

async function load() {
  const appEl = document.getElementById('app');
  if (!token) {
    appEl.innerHTML = '<p class="text-center text-red-400 mt-20">無效的查詢連結</p>';
    return;
  }
  appEl.innerHTML = '<div class="text-center text-gray-500 mt-20">載入中…</div>';
  let data;
  try {
    data = await loadCustomerData();
  } catch (e) {
    appEl.innerHTML = `<div class="text-center mt-20">
        <p class="text-red-400 mb-3">連線逾時，載入失敗</p>
        <button onclick="load()" style="background:#f59e0b;color:#111827;font-weight:600;padding:8px 20px;border:none;border-radius:8px;cursor:pointer;">重新載入</button>
      </div>`;
    return;
  }
  if (data.error) {
    appEl.innerHTML = `<p class="text-center text-red-400 mt-20">${data.error === 'Invalid token' ? '連結無效或已過期' : data.error}</p>`;
    return;
  }

  document.getElementById('subtitle').textContent = data.customers.join('、') + ' · 訂單查詢';
  document.title = '獨品工坊 · ' + data.customers.join('、');

  const items = data.items;
  const activeItems = items.filter(it => it['進度'] !== '完成');
  const doneItems   = items.filter(it => it['進度'] === '完成');

  const progColor = { '待施工': 'bg-gray-600', '施工中': 'bg-blue-700', '完成': 'bg-green-700' };

  function renderItems(list) {
    if (!list.length) return '<p class="text-gray-500 text-sm mb-4">暫無項目</p>';
    // 按客戶分組
    const groups = {};
    list.forEach(it => {
      const c = it['客戶'] || '未知';
      if (!groups[c]) groups[c] = [];
      groups[c].push(it);
    });
    return Object.entries(groups).map(([cus, its]) => `
      <div class="mb-4">
        ${Object.keys(groups).length > 1 ? `<div class="text-xs text-amber-400 font-semibold mb-2">${cus}</div>` : ''}
        ${its.map(it => {
          const prog = it['進度'] || '待施工';
          const color = progColor[prog] || 'bg-gray-600';
          const amt = Number(it['金額'] || 0);
          // 訂購類型（客訂／現貨）沿用「車號」欄位；只在為客訂／現貨時顯示於品名最前方
          const orderType = it['車號'] || '';
          const typeChip = (orderType === '客訂' || orderType === '現貨')
            ? `<span class="text-xs px-1.5 py-0.5 rounded font-semibold mr-1 ${orderType==='客訂'?'bg-rose-900 text-rose-200':'bg-sky-900 text-sky-200'}">${orderType}</span>`
            : '';
          return `
          <div class="card">
            <div class="flex justify-between items-start">
              <div class="flex-1 min-w-0">
                <div class="font-semibold">${typeChip}${it['品名'] || '-'}${it['規格'] ? ' · ' + it['規格'] : ''}</div>
                <div class="text-xs text-gray-400 mt-0.5">
                  ${it['數量']} × $${Number(it['單價']).toLocaleString()}
                </div>
                ${it['交貨期限'] ? `<div class="text-xs text-gray-500 mt-0.5">預計交期：${it['交貨期限']}</div>` : ''}
                ${it['完工日期'] ? `<div class="text-xs text-amber-400 mt-0.5">完工：${it['完工日期']}</div>` : ''}
                ${it['備註'] ? `<div class="text-xs text-gray-500 mt-0.5">備註：${it['備註']}</div>` : ''}
                ${(() => {
                  const refs = String(it['參考圖片']||'').split(',').map(u=>u.trim()).filter(Boolean);
                  if (!refs.length) return '';
                  return `<div class="mt-2"><div class="text-xs text-gray-500 mb-1">參考圖片</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                      ${refs.map(u=>`<a href="${u}" target="_blank"><img src="${thumbUrl(u)}" loading="lazy" decoding="async" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #374151;"/></a>`).join('')}
                    </div></div>`;
                })()}
                <div class="mt-2">
                  <span class="${color} text-white text-xs px-2 py-0.5 rounded-full font-semibold">${prog}</span>
                </div>
              </div>
              ${amt ? `<div class="text-amber-400 font-bold ml-3 shrink-0">$${amt.toLocaleString()}</div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    `).join('');
  }

  const doneTotal = doneItems.reduce((s, it) => s + Number(it['金額'] || 0), 0);

  document.getElementById('app').innerHTML = `
    <div class="section-title">進行中（${activeItems.length}）</div>
    ${renderItems(activeItems)}
    <div class="section-title">完工待收款（${doneItems.length}）</div>
    ${renderItems(doneItems)}
    ${doneItems.length ? `
    <div style="border-top:1px solid #374151;margin-top:4px;padding-top:12px;text-align:right;">
      <span class="text-gray-400 text-sm">應收總金額：</span>
      <span class="text-amber-400 font-bold text-lg">$${doneTotal.toLocaleString()}</span>
    </div>` : ''}
    <div class="text-center text-xs text-gray-600 mt-8">獨品工坊客製彩繪 · 僅供訂單查詢</div>
  `;
}

load();
</script>
</body>
</html>
